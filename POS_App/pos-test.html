<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .login-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            margin: 50px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-section h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .pos-interface {
            display: none;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .products-section, .cart-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .product-card {
            border: 2px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .product-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102,126,234,0.2);
        }
        .product-card h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .product-card .price {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
        }
        .product-card .stock {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-qty {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            font-size: 18px;
        }
        .remove-btn {
            background: #e74c3c;
            width: auto;
            padding: 5px 10px;
            margin-left: 10px;
        }
        .cart-summary {
            border-top: 2px solid #667eea;
            padding-top: 15px;
            margin-top: 15px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .summary-row.total {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .payment-section {
            margin-top: 20px;
        }
        .session-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .search-box {
            margin-bottom: 15px;
        }
        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }
        .btn-danger {
            background: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h2>🏪 POS System Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" value="demo">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" value="demo123">
            </div>
            <button onclick="login()">Login</button>
            <div id="loginError" class="error-msg"></div>
        </div>

        <!-- POS Interface -->
        <div id="posInterface" class="pos-interface">
            <div class="header">
                <h1>🏪 Point of Sale System</h1>
                <div class="session-info">
                    <strong>User:</strong> <span id="userName"></span> | 
                    <strong>Till Session:</strong> <span id="sessionStatus">Not Open</span>
                    <button class="btn-secondary" onclick="showSessionModal()" style="float: right; width: auto; padding: 8px 15px;">Manage Till</button>
                </div>
            </div>

            <div id="successMsg" class="success-msg"></div>
            <div id="errorMsg" class="error-msg"></div>

            <div class="grid">
                <!-- Products Section -->
                <div class="products-section">
                    <h2>Products</h2>
                    <div class="search-box">
                        <input type="text" id="searchProducts" placeholder="Search products..." onkeyup="searchProducts()">
                    </div>
                    <div id="productsGrid" class="products-grid"></div>
                </div>

                <!-- Cart Section -->
                <div class="cart-section">
                    <h2>Shopping Cart</h2>
                    <div id="cartItems" class="cart-items"></div>
                    
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">R 0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>VAT (15%):</span>
                            <span id="vat">R 0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>TOTAL:</span>
                            <span id="total">R 0.00</span>
                        </div>
                    </div>

                    <div class="payment-section">
                        <div class="form-group">
                            <label>Payment Method</label>
                            <select id="paymentMethod">
                                <option value="CASH">Cash</option>
                                <option value="CARD">Card</option>
                                <option value="EFT">EFT</option>
                            </select>
                        </div>
                        <button onclick="completeSale()" id="checkoutBtn" disabled>Complete Sale</button>
                        <button class="btn-danger" onclick="clearCart()">Clear Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let token = null;
        let currentUser = null;
        let currentSession = null;
        let products = [];
        let cart = [];

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    token = result.token;
                    currentUser = result.user;
                    document.getElementById('userName').textContent = currentUser.fullName;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('posInterface').style.display = 'block';
                    loadProducts();
                    checkOpenSession();
                } else {
                    errorDiv.textContent = result.error;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Login failed: ' + error.message;
                errorDiv.style.display = 'block';
            }
        }

        async function checkOpenSession() {
            try {
                const response = await fetch(`${API_URL}/pos/sessions?status=open`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();
                
                if (result.sessions && result.sessions.length > 0) {
                    currentSession = result.sessions[0];
                    document.getElementById('sessionStatus').textContent = `Open - ${currentSession.till_name}`;
                    document.getElementById('checkoutBtn').disabled = false;
                } else {
                    showMessage('Please open a till session first', 'error');
                }
            } catch (error) {
                console.error('Error checking session:', error);
            }
        }

        async function showSessionModal() {
            if (currentSession) {
                const close = confirm('Close current till session?');
                if (close) {
                    const balance = prompt('Enter closing balance:');
                    if (balance !== null) {
                        await closeTillSession(parseFloat(balance));
                    }
                }
            } else {
                const openBalance = prompt('Enter opening balance:', '0');
                if (openBalance !== null) {
                    await openTillSession(parseFloat(openBalance));
                }
            }
        }

        async function openTillSession(openingBalance) {
            try {
                const tillsResponse = await fetch(`${API_URL}/pos/tills`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const tillsResult = await tillsResponse.json();
                
                if (tillsResult.tills.length === 0) {
                    showMessage('No tills available', 'error');
                    return;
                }

                const tillId = tillsResult.tills[0].id;

                const response = await fetch(`${API_URL}/pos/sessions/open`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tillId, openingBalance })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Till session opened successfully', 'success');
                    checkOpenSession();
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Error opening session: ' + error.message, 'error');
            }
        }

        async function closeTillSession(closingBalance) {
            try {
                const response = await fetch(`${API_URL}/pos/sessions/${currentSession.id}/close`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ closingBalance, notes: 'Manual close' })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`Session closed. Variance: R ${result.variance.toFixed(2)}`, 'success');
                    currentSession = null;
                    document.getElementById('sessionStatus').textContent = 'Not Open';
                    document.getElementById('checkoutBtn').disabled = true;
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Error closing session: ' + error.message, 'error');
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/pos/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();
                products = result.products;
                displayProducts(products);
            } catch (error) {
                showMessage('Error loading products: ' + error.message, 'error');
            }
        }

        function displayProducts(productsToShow) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            productsToShow.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(product);
                card.innerHTML = `
                    <h3>${product.product_name}</h3>
                    <div class="price">R ${product.unit_price.toFixed(2)}</div>
                    <div class="stock">Stock: ${product.stock_quantity}</div>
                `;
                grid.appendChild(card);
            });
        }

        function searchProducts() {
            const search = document.getElementById('searchProducts').value.toLowerCase();
            const filtered = products.filter(p => 
                p.product_name.toLowerCase().includes(search) ||
                p.product_code.toLowerCase().includes(search)
            );
            displayProducts(filtered);
        }

        function addToCart(product) {
            const existing = cart.find(item => item.productId === product.id);
            
            if (existing) {
                if (existing.quantity < product.stock_quantity) {
                    existing.quantity++;
                } else {
                    showMessage('Not enough stock', 'error');
                    return;
                }
            } else {
                cart.push({
                    productId: product.id,
                    name: product.product_name,
                    price: product.unit_price,
                    quantity: 1,
                    maxStock: product.stock_quantity
                });
            }

            updateCart();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.productId === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else if (item.quantity > item.maxStock) {
                    item.quantity = item.maxStock;
                    showMessage('Not enough stock', 'error');
                }
                updateCart();
            }
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.productId !== productId);
            updateCart();
        }

        function updateCart() {
            const cartDiv = document.getElementById('cartItems');
            cartDiv.innerHTML = '';

            if (cart.length === 0) {
                cartDiv.innerHTML = '<p style="text-align: center; color: #999;">Cart is empty</p>';
            } else {
                cart.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div class="cart-item-info">
                            <strong>${item.name}</strong><br>
                            <small>R ${item.price.toFixed(2)} each</small>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateQuantity(${item.productId}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.productId}, 1)">+</button>
                            <button class="remove-btn" onclick="removeFromCart(${item.productId})">✕</button>
                        </div>
                        <div><strong>R ${(item.price * item.quantity).toFixed(2)}</strong></div>
                    `;
                    cartDiv.appendChild(itemDiv);
                });
            }

            // Calculate totals
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const vat = subtotal * 0.15;
            const total = subtotal + vat;

            document.getElementById('subtotal').textContent = `R ${subtotal.toFixed(2)}`;
            document.getElementById('vat').textContent = `R ${vat.toFixed(2)}`;
            document.getElementById('total').textContent = `R ${total.toFixed(2)}`;
        }

        function clearCart() {
            if (confirm('Clear all items from cart?')) {
                cart = [];
                updateCart();
            }
        }

        async function completeSale() {
            if (cart.length === 0) {
                showMessage('Cart is empty', 'error');
                return;
            }

            if (!currentSession) {
                showMessage('Please open a till session first', 'error');
                return;
            }

            const paymentMethod = document.getElementById('paymentMethod').value;

            try {
                const response = await fetch(`${API_URL}/pos/sales`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tillSessionId: currentSession.id,
                        items: cart.map(item => ({
                            productId: item.productId,
                            quantity: item.quantity
                        })),
                        paymentMethod
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`Sale completed! Sale #${result.saleNumber} - Total: R ${result.totalAmount.toFixed(2)}`, 'success');
                    cart = [];
                    updateCart();
                    loadProducts(); // Refresh stock levels
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Error completing sale: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const msgDiv = type === 'success' ? document.getElementById('successMsg') : document.getElementById('errorMsg');
            msgDiv.textContent = message;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
